extend type Mutation {
  """Enable or disable rejection of requests matching the supplied filters."""
  reject(enabled: Boolean = true, method: [Method], operator: OperatorTypes = or, type: [ResourceType], url: [String], regex: [String]): RejectResponse
  """Read matching network requests, optionally waiting for a match."""
  request(type: [ResourceType], method: [Method], timeout: Float, url: [String], wait: Boolean = true, operator: OperatorTypes = or): [RequestResponse]
  """Read matching network responses, optionally waiting for a match."""
  response(status: [Int], method: [Method], operator: OperatorTypes = or, timeout: Float, type: [ResourceType], url: [String], wait: Boolean = true): [ResponseResponse]
  """
  Respond to matching requests with the supplied status, headers, and body.
  """
  fulfill(url: [String], regex: [String], method: [Method], type: [ResourceType], operator: OperatorTypes = or, status: Int = 200, contentType: String, body: String, base64Body: String, headers: [HeaderInput]): FulfillResponse
}

enum Method {
  CONNECT
  DELETE
  GET
  HEAD
  OPTIONS
  PATCH
  POST
  PUT
  TRACE
}

enum OperatorTypes {
  and
  or
}

enum ResourceType {
  cspviolationreport
  document
  eventsource
  fetch
  font
  image
  manifest
  media
  other
  ping
  prefetch
  preflight
  script
  signedexchange
  stylesheet
  texttrack
  websocket
  xhr
}

type RejectResponse {
  """Elapsed time in milliseconds."""
  time: Float
  """The enabled value."""
  enabled: Boolean
}

type RequestResponse {
  """The url value."""
  url: String
  """The method value."""
  method: Method
  """The type value."""
  type: ResourceType
  """The headers value."""
  headers: [Headers]
}

type Headers {
  """The name value."""
  name: String
  """The value value."""
  value: String
}

type ResponseResponse {
  """The status value."""
  status: Int
  """The url value."""
  url: String
  """The method value."""
  method: Method
  """The type value."""
  type: ResourceType
  """The headers value."""
  headers: [Headers]
  """The body value."""
  body: String
  """The base64Encoded value."""
  base64Encoded: Boolean!
}

input HeaderInput {
  name: String!
  value: String!
}

type FulfillResponse {
  """Elapsed time in milliseconds."""
  time: Float
}
