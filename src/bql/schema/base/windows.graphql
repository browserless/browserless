extend type Mutation {
  """
  List open page targets.
  """
  windows: [WindowInfo]
  """
  Select a page target by ID, URL, title, or recency.
  """
  switchToWindow(
    targetId: String
    url: String
    title: String
    newest: Boolean = false
    timeout: Float = 5000
    waitUntil: WaitUntilGoto
  ): SwitchWindowResponse
}

type WindowInfo {
  """
  The targetId value.
  """
  targetId: String!
  """
  The url value.
  """
  url: String
  """
  The title value.
  """
  title: String
  """
  The active value.
  """
  active: Boolean!
  """
  The browserContextId value.
  """
  browserContextId: String
}

type SwitchWindowResponse {
  """
  The success value.
  """
  success: Boolean!
  """
  The error value.
  """
  error: String
  """
  The title value.
  """
  title: String
  """
  The url value.
  """
  url: String
  """
  The navigation value.
  """
  navigation: HTTPResponse
}
