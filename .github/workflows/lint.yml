name: Lint

on: [workflow_call]

jobs:
  Lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Check Node runtime pins and updater
        run: |
          node scripts/ci/node-runtime.js
          node --test scripts/ci/node-runtime.test.js
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        run: npm install -g npm@11.21.2 --ignore-scripts
      - name: Install modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: npm clean-install
      - name: Test FFmpeg installer
        run: node --test scripts/install-playwright-ffmpeg.test.js
      - name: Run ESLint
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: npm run lint
