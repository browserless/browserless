name: Chromium

on: [workflow_call, workflow_dispatch]

permissions:
  contents: read

jobs:
  Test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read Node runtime
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      # Copy verified assets into the base image; never pass credentials to Docker.
      - name: Install latest adblock release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/install-adblock.js

      - name: Build the base layer
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: docker build --build-arg NODE_VERSION="$NODE_VERSION" -f ./docker/base/Dockerfile -t ghcr.io/browserless/base:"$NODE_VERSION" .

      - name: Build the Chromium image
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: docker build --build-arg VERSION="$NODE_VERSION" -f ./docker/chromium/Dockerfile -t ghcr.io/browserless/chromium:"$NODE_VERSION" .

      - name: Test the Chromium image
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: docker run --ipc=host -e CI=true --entrypoint ./scripts/test.sh ghcr.io/browserless/chromium:"$NODE_VERSION"
