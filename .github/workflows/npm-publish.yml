name: Publish to npm

# Fires on the vX.Y.Z tag that release-please creates when its Release PR is
# merged. The same tag also triggers docker-publish-stable.yml, so one merge
# ships the npm package and all Docker images together on the same version.
#
# Browser/unit tests are NOT re-run here: they run via pr-checks.yml on the
# Release PR before it is merged, and they require Docker/browser images that a
# bare runner does not have. Build without OIDC, then publish the packed SDK.

on:
  push:
    tags:
      - 'v*.*.*'

# Serialize publishes per-tag — two rapid pushes to the same ref would otherwise
# race two `npm publish` jobs, with the loser failing 403 (already published).
# cancel-in-progress: false because cancelling a mid-flight publish would leave
# the npm registry inconsistent with the GitHub Release.
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # No git push/pull after checkout, so don't persist credentials.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 26
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        run: npm install -g npm@11.21.2 --ignore-scripts # zizmor: ignore[adhoc-packages] -- exact npm bootstrap; lifecycle scripts disabled

      - name: Install dependencies
        run: npm ci

      # prepack runs build:dev here, without access to a publishing identity.
      - name: Pack SDK
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          mv "$RUNNER_TEMP/npm-package/"*.tgz "$RUNNER_TEMP/npm-package/package.tgz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/package.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
          check-latest: true
      - name: Ensure npm >= 11.10.0 (min-release-age support)
        run: npm install -g npm@11.21.2 --ignore-scripts # zizmor: ignore[adhoc-packages] -- exact npm bootstrap; lifecycle scripts disabled
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      # Publish the same-run tarball without dependency/package lifecycle scripts.
      # Provenance is attached automatically via npm trusted publishing (OIDC).
      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/npm-package/package.tgz" --access public --ignore-scripts

      # The package is already published by this point; a Slack hiccup must not
      # mark the release as failed.
      - name: Notify Slack
        if: success()
        continue-on-error: true
        run: bash scripts/ci/notify-slack.sh
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK }}
