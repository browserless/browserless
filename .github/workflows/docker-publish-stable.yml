name: Publish Semantic Version Docker Images to GitHub Container Registry

on:
  push:
    tags: [v2.*]

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}
    with:
      tag: ${{ github.ref_name }}
