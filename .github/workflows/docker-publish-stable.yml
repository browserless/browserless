name: Publish Semantic Version Docker Images to GitHub Container Registry

on:
  push:
    tags: [v2.*]

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml # zizmor: ignore[self-repository] -- reusable workflow at this commit
    with:
      tag: ${{ github.ref_name }}
