name: Publish Latest Docker Images to GitHub Container Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'browserless/browserless' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml # zizmor: ignore[self-repository] -- reusable workflow at this commit
    with:
      tag: latest
