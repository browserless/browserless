name: Chrome

on: [workflow_call]

jobs:
  Test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Read Node runtime
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> "$GITHUB_ENV"

      - name: Build the base layer
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: docker build --build-arg NODE_VERSION="$NODE_VERSION" -f ./docker/base/Dockerfile -t ghcr.io/browserless/base:"$NODE_VERSION" .

      - name: Build the Chrome image
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: docker build --build-arg VERSION="$NODE_VERSION" -f ./docker/chrome/Dockerfile -t ghcr.io/browserless/chrome:"$NODE_VERSION" .

      - name: Test the Chrome image
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 30
          command: docker run --ipc=host -e CI=true --entrypoint ./scripts/test.sh ghcr.io/browserless/chrome:"$NODE_VERSION"
