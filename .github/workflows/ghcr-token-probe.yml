name: Temporary GHCR token proof

on:
  push:
    branches: [ci/workflow-hardening]
    paths: [.github/workflows/ghcr-token-probe.yml]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            base,
            chromium,
            chrome,
            edge,
            firefox,
            webkit,
            webkit-heavy,
            multi,
            multi-heavy,
          ]
    env:
      PACKAGE: ${{ matrix.package }}
      GH_TOKEN: ${{ github.token }}
      TEST_TAG: gh-token-auth-test
    steps:
      - name: Log in with workflow token
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Copy published manifest to isolated test version
        run: |
          endpoint="orgs/browserless/packages/container/${PACKAGE}/versions"
          gh api --paginate "$endpoint?per_page=100" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/before.json"
          jq -e --arg tag "$TEST_TAG" 'all(.[]; (.metadata.container.tags | index($tag)) == null)' "$RUNNER_TEMP/before.json"
          source=$(docker buildx imagetools inspect "ghcr.io/browserless/${PACKAGE}:latest" --format '{{.Manifest.Digest}}')
          echo "Source ${PACKAGE}:latest = ${source}"
          # A distinct index prevents deletion of a version shared by production tags.
          docker buildx imagetools create \
            --annotation "index:io.browserless.token-probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -t "ghcr.io/browserless/${PACKAGE}:${TEST_TAG}" \
            "ghcr.io/browserless/${PACKAGE}@${source}"
          docker buildx imagetools inspect "ghcr.io/browserless/${PACKAGE}:${TEST_TAG}"
          echo "PUSH_OK ${PACKAGE}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete only the isolated test version
        if: always()
        run: |
          endpoint="orgs/browserless/packages/container/${PACKAGE}/versions"
          gh api --paginate "$endpoint?per_page=100" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/after.json"
          jq --arg tag "$TEST_TAG" '[.[] | select(.metadata.container.tags | index($tag))]' "$RUNNER_TEMP/after.json" > "$RUNNER_TEMP/test.json"
          if [ "$(jq length "$RUNNER_TEMP/test.json")" = 0 ]; then
            echo "NO_TEST_TAG ${PACKAGE}" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Refuse cleanup if any production tag shares this version, or if it predated this run.
          jq -e --arg tag "$TEST_TAG" 'length == 1 and .[0].metadata.container.tags == [$tag]' "$RUNNER_TEMP/test.json"
          id=$(jq -r '.[0].id' "$RUNNER_TEMP/test.json")
          digest=$(jq -r '.[0].name' "$RUNNER_TEMP/test.json")
          echo "TEST_VERSION ${PACKAGE} id=${id} digest=${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e --argjson id "$id" 'all(.[]; .id != $id)' "$RUNNER_TEMP/before.json"
          gh api --method DELETE "$endpoint/$id"
          gh api --paginate "$endpoint?per_page=100" --jq '.[]' | jq -s --arg tag "$TEST_TAG" -e 'all(.[]; (.metadata.container.tags | index($tag)) == null)'
          echo "CLEANUP_OK ${PACKAGE}" | tee -a "$GITHUB_STEP_SUMMARY"
